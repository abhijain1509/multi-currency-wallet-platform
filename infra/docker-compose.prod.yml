services:
  backend:
    image: ${BACKEND_IMAGE:-wallet-backend:latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  frontend:
    image: ${FRONTEND_IMAGE:-wallet-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
