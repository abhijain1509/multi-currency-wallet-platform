# Render.com blueprint — provisions Postgres + backend + frontend.
# Deploy: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# After the first deploy, set the frontend's BACKEND_ORIGIN to the backend URL
# shown in the dashboard (e.g. https://wallet-backend.onrender.com).

databases:
  - name: wallet-db
    plan: free
    databaseName: wallet
    user: wallet

services:
  - type: web
    name: wallet-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # HTTPS everywhere in the cloud → secure cookies.
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: wallet-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Set to the backend service URL after it deploys, e.g.
      # https://wallet-backend.onrender.com
      - key: BACKEND_ORIGIN
        sync: false
