services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    # No published ports: reachable only on the internal compose network.
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://wallet:wallet@db:5432/wallet
      REDIS_URL: redis://cache:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # Not published to the host: the API is only reachable through the frontend
    # reverse proxy (/api), so it is never a directly public endpoint.
    expose:
      - "8000"
    volumes:
      - media_data:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  media_data:
